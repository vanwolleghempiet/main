<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — delaware Manufacturing Playbook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            delaware: { DEFAULT: '#C8102E', dark: '#a00d24', light: '#f9e8eb' },
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .tab-active { border-bottom: 2px solid #C8102E; color: #C8102E; }
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    textarea { resize: vertical; }
    .save-flash { animation: flashGreen 1s ease; }
    @keyframes flashGreen { 0% { background-color: #d1fae5; } 100% { background-color: transparent; } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script src="data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ─── Supabase Config (same as main app) ───
    const SUPABASE_URL = 'https://agcjvxedncwiklyamrvj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EMZezZt4i8dIFGvE_997Og_YQUgjGc9';
    const supabaseConfigured = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
    let sb = null;
    let supabaseInitError = null;
    if (supabaseConfigured) {
      try {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        supabaseInitError = e.message;
        console.error('Supabase init failed:', e);
      }
    }

    // ─── Toast ───
    function Toast({ message, type }) {
      if (!message) return null;
      const bg = type === 'error' ? 'bg-red-600' : 'bg-emerald-600';
      return (
        <div className={`fixed bottom-6 right-6 ${bg} text-white px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium z-50 fade-in`}>
          {message}
        </div>
      );
    }

    function useToast() {
      const [toast, setToast] = useState(null);
      const show = useCallback((message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      }, []);
      return { toast, show };
    }

    // ─── Reusable Components ───
    function Field({ label, value, onChange, multiline, placeholder, small }) {
      const cls = `w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-delaware/30 focus:border-delaware ${small ? 'text-xs' : ''}`;
      return (
        <div className="mb-3">
          <label className="block text-xs font-semibold text-gray-500 mb-1">{label}</label>
          {multiline ? (
            <textarea className={cls} rows={3} value={value || ''} onChange={e => onChange(e.target.value)} placeholder={placeholder} />
          ) : (
            <input className={cls} value={value || ''} onChange={e => onChange(e.target.value)} placeholder={placeholder} />
          )}
        </div>
      );
    }

    function ListEditor({ label, items, onChange, placeholder }) {
      const add = () => onChange([...items, '']);
      const update = (i, val) => { const copy = [...items]; copy[i] = val; onChange(copy); };
      const remove = (i) => onChange(items.filter((_, idx) => idx !== i));

      return (
        <div className="mb-3">
          <label className="block text-xs font-semibold text-gray-500 mb-1">{label}</label>
          <div className="space-y-1.5">
            {items.map((item, i) => (
              <div key={i} className="flex gap-1.5">
                <input
                  className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-delaware/30"
                  value={item}
                  onChange={e => update(i, e.target.value)}
                  placeholder={placeholder}
                />
                <button onClick={() => remove(i)} className="text-red-400 hover:text-red-600 text-xs px-2" title="Remove">✕</button>
              </div>
            ))}
          </div>
          <button onClick={add} className="mt-1.5 text-xs text-delaware hover:text-delaware-dark font-medium">+ Add item</button>
        </div>
      );
    }

    function ObjectListEditor({ label, items, fields, onChange }) {
      const add = () => {
        const empty = {};
        fields.forEach(f => { empty[f.key] = ''; });
        onChange([...items, empty]);
      };
      const update = (i, key, val) => {
        const copy = items.map((item, idx) => idx === i ? { ...item, [key]: val } : item);
        onChange(copy);
      };
      const remove = (i) => onChange(items.filter((_, idx) => idx !== i));

      return (
        <div className="mb-4">
          <label className="block text-xs font-bold text-gray-600 mb-2">{label}</label>
          <div className="space-y-3">
            {items.map((item, i) => (
              <div key={i} className="bg-gray-50 rounded-lg p-3 border border-gray-100 relative">
                <button onClick={() => remove(i)} className="absolute top-2 right-2 text-red-400 hover:text-red-600 text-xs" title="Remove">✕</button>
                {fields.map(f => (
                  <div key={f.key} className="mb-1.5">
                    <label className="block text-[10px] font-medium text-gray-400 mb-0.5">{f.label}</label>
                    {f.multiline ? (
                      <textarea
                        className="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-delaware/30"
                        rows={2}
                        value={item[f.key] || ''}
                        onChange={e => update(i, f.key, e.target.value)}
                      />
                    ) : (
                      <input
                        className="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-delaware/30"
                        value={item[f.key] || ''}
                        onChange={e => update(i, f.key, e.target.value)}
                      />
                    )}
                  </div>
                ))}
              </div>
            ))}
          </div>
          <button onClick={add} className="mt-2 text-xs text-delaware hover:text-delaware-dark font-medium">+ Add {label.toLowerCase().replace(/s$/, '')}</button>
        </div>
      );
    }

    function SaveButton({ onClick, saving, label }) {
      return (
        <button
          onClick={onClick}
          disabled={saving}
          className="bg-delaware hover:bg-delaware-dark disabled:opacity-50 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors"
        >
          {saving ? 'Saving...' : (label || 'Save')}
        </button>
      );
    }

    // ─── Personas Tab ───
    function PersonasTab({ toast }) {
      const [personas, setPersonas] = useState([]);
      const [selected, setSelected] = useState(null);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        async function load() {
          if (sb) {
            const { data, error } = await sb.from('personas').select('*');
            if (error) { console.error('personas fetch:', error.message); return; }
            setPersonas((data || []).map(p => ({
              id: p.id, label: p.label, subtitle: p.subtitle, emoji: p.emoji, focus: p.focus,
              careMost: p.care_most || [], keepsUpAtNight: p.keeps_up_at_night || [],
            })));
          } else {
            setPersonas(JSON.parse(JSON.stringify(PERSONAS)));
          }
        }
        load();
      }, []);

      const update = (key, val) => {
        setPersonas(prev => prev.map(p => p.id === selected ? { ...p, [key]: val } : p));
      };

      const save = async () => {
        const p = personas.find(x => x.id === selected);
        if (!p) return;
        setSaving(true);
        try {
          if (sb) {
            const { error } = await sb.from('personas').update({
              label: p.label, subtitle: p.subtitle, emoji: p.emoji, focus: p.focus,
              care_most: p.careMost, keeps_up_at_night: p.keepsUpAtNight,
            }).eq('id', p.id);
            if (error) throw error;
          }
          toast.show('Persona saved');
        } catch (e) { toast.show('Save failed: ' + e.message, 'error'); }
        setSaving(false);
      };

      const p = personas.find(x => x.id === selected);

      return (
        <div className="fade-in">
          <div className="flex gap-3 mb-6">
            {personas.map(per => (
              <button
                key={per.id}
                onClick={() => setSelected(per.id)}
                className={`px-4 py-3 rounded-xl border-2 text-left transition-all ${
                  selected === per.id ? 'border-delaware bg-red-50' : 'border-gray-200 bg-white hover:border-gray-300'
                }`}
              >
                <span className="text-xl">{per.emoji}</span>
                <div className="text-sm font-bold mt-1">{per.label}</div>
                <div className="text-xs text-gray-400">{per.subtitle}</div>
              </button>
            ))}
          </div>

          {p && (
            <div className="bg-white rounded-xl border border-gray-200 p-6">
              <div className="grid md:grid-cols-2 gap-6">
                <div>
                  <Field label="Label" value={p.label} onChange={v => update('label', v)} />
                  <Field label="Subtitle" value={p.subtitle} onChange={v => update('subtitle', v)} />
                  <Field label="Emoji" value={p.emoji} onChange={v => update('emoji', v)} />
                  <Field label="Focus" value={p.focus} onChange={v => update('focus', v)} multiline />
                </div>
                <div>
                  <ListEditor label="What they care most about" items={p.careMost} onChange={v => update('careMost', v)} placeholder="Care point..." />
                  <ListEditor label="What keeps them up at night" items={p.keepsUpAtNight} onChange={v => update('keepsUpAtNight', v)} placeholder="Concern..." />
                </div>
              </div>
              <div className="mt-4 flex justify-end">
                <SaveButton onClick={save} saving={saving} />
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── Sub-Segments Tab ───
    function SubSegmentsTab({ toast }) {
      const [segments, setSegments] = useState([]);
      const [saving, setSaving] = useState({});

      useEffect(() => {
        async function load() {
          if (sb) {
            const { data, error } = await sb.from('sub_segments').select('*');
            if (error) { console.error('sub_segments fetch:', error.message); return; }
            setSegments(data || []);
          } else {
            setSegments(JSON.parse(JSON.stringify(SUB_SEGMENTS)));
          }
        }
        load();
      }, []);

      const update = (id, key, val) => {
        setSegments(prev => prev.map(s => s.id === id ? { ...s, [key]: val } : s));
      };

      const save = async (seg) => {
        setSaving(prev => ({ ...prev, [seg.id]: true }));
        try {
          if (sb) {
            const { error } = await sb.from('sub_segments').update({
              label: seg.label, short: seg.short, description: seg.description,
            }).eq('id', seg.id);
            if (error) throw error;
          }
          toast.show(`"${seg.short}" saved`);
        } catch (e) { toast.show('Save failed: ' + e.message, 'error'); }
        setSaving(prev => ({ ...prev, [seg.id]: false }));
      };

      return (
        <div className="fade-in space-y-4">
          {segments.map(seg => (
            <div key={seg.id} className="bg-white rounded-xl border border-gray-200 p-5">
              <div className="grid md:grid-cols-3 gap-4">
                <Field label="Label" value={seg.label} onChange={v => update(seg.id, 'label', v)} />
                <Field label="Short name" value={seg.short} onChange={v => update(seg.id, 'short', v)} />
                <Field label="Description" value={seg.description} onChange={v => update(seg.id, 'description', v)} />
              </div>
              <div className="mt-2 flex justify-end">
                <SaveButton onClick={() => save(seg)} saving={saving[seg.id]} />
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─── Storylines Tab ───
    function StorylinesTab({ toast }) {
      const [storylines, setStorylines] = useState([]);
      const [saving, setSaving] = useState({});

      useEffect(() => {
        async function load() {
          if (sb) {
            const { data, error } = await sb.from('storylines').select('*').order('sort_order');
            if (error) { console.error('storylines fetch:', error.message); return; }
            setStorylines((data || []).map(s => ({
              id: s.id, name: s.name, icon: s.icon, accent: s.accent,
              relevantSegments: s.relevant_segments || [], sortOrder: s.sort_order,
            })));
          } else {
            setStorylines(STORYLINES.map((s, i) => ({
              id: s.id, name: s.name, icon: s.icon, accent: s.accent,
              relevantSegments: s.relevantSegments || [], sortOrder: i + 1,
            })));
          }
        }
        load();
      }, []);

      const update = (id, key, val) => {
        setStorylines(prev => prev.map(s => s.id === id ? { ...s, [key]: val } : s));
      };

      const save = async (sl) => {
        setSaving(prev => ({ ...prev, [sl.id]: true }));
        try {
          if (sb) {
            const { error } = await sb.from('storylines').update({
              name: sl.name, icon: sl.icon, accent: sl.accent,
              relevant_segments: sl.relevantSegments, sort_order: sl.sortOrder,
            }).eq('id', sl.id);
            if (error) throw error;
          }
          toast.show(`"${sl.name}" saved`);
        } catch (e) { toast.show('Save failed: ' + e.message, 'error'); }
        setSaving(prev => ({ ...prev, [sl.id]: false }));
      };

      const allSegIds = ['industrial-equipment','components','infrastructure','aerospace','medical','automotive'];

      return (
        <div className="fade-in space-y-4">
          {storylines.map(sl => (
            <div key={sl.id} className="bg-white rounded-xl border border-gray-200 p-5">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-1.5 h-8 rounded-full" style={{ backgroundColor: sl.accent }} />
                <span className="text-lg">{sl.icon}</span>
                <span className="font-bold text-gray-900">{sl.name}</span>
              </div>
              <div className="grid md:grid-cols-4 gap-4">
                <Field label="Name" value={sl.name} onChange={v => update(sl.id, 'name', v)} />
                <Field label="Icon (emoji)" value={sl.icon} onChange={v => update(sl.id, 'icon', v)} />
                <Field label="Accent color" value={sl.accent} onChange={v => update(sl.id, 'accent', v)} />
                <Field label="Sort order" value={String(sl.sortOrder)} onChange={v => update(sl.id, 'sortOrder', parseInt(v) || 0)} />
              </div>
              <div className="mt-3">
                <label className="block text-xs font-semibold text-gray-500 mb-1.5">Relevant segments</label>
                <div className="flex flex-wrap gap-2">
                  {allSegIds.map(segId => {
                    const active = sl.relevantSegments.includes(segId);
                    return (
                      <button
                        key={segId}
                        onClick={() => {
                          const next = active
                            ? sl.relevantSegments.filter(s => s !== segId)
                            : [...sl.relevantSegments, segId];
                          update(sl.id, 'relevantSegments', next);
                        }}
                        className={`text-xs px-2.5 py-1 rounded-full font-medium transition-all ${
                          active ? 'bg-delaware text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'
                        }`}
                      >
                        {segId}
                      </button>
                    );
                  })}
                </div>
              </div>
              <div className="mt-4 flex justify-end">
                <SaveButton onClick={() => save(sl)} saving={saving[sl.id]} />
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─── Content Tab (the big one: 21 blocks) ───
    function ContentTab({ toast }) {
      const [storylines, setStorylines] = useState([]);
      const [personas, setPersonas] = useState([]);
      const [content, setContent] = useState([]);
      const [selectedStoryline, setSelectedStoryline] = useState(null);
      const [selectedPersona, setSelectedPersona] = useState(null);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        async function load() {
          if (sb) {
            const [slRes, pRes, cRes] = await Promise.all([
              sb.from('storylines').select('id, name, icon, accent').order('sort_order'),
              sb.from('personas').select('id, label, emoji'),
              sb.from('storyline_content').select('*'),
            ]);
            if (slRes.error) { console.error('storylines fetch:', slRes.error.message); }
            if (pRes.error) { console.error('personas fetch:', pRes.error.message); }
            if (cRes.error) { console.error('storyline_content fetch:', cRes.error.message); }
            setStorylines(slRes.data || []);
            setPersonas(pRes.data || []);
            setContent((cRes.data || []).map(c => ({
              id: c.id,
              storylineId: c.storyline_id,
              personaId: c.persona_id,
              painPoint: c.pain_point || { headline: '', description: '', dataPoint: '' },
              strategicTalkingPoints: c.strategic_talking_points || [],
              tacticalSolutions: c.tactical_solutions || [],
              marketInsights: c.market_insights || [],
              referenceCustomers: c.reference_customers || [],
              conversationStarters: c.conversation_starters || [],
            })));
          } else {
            setStorylines(STORYLINES.map(s => ({ id: s.id, name: s.name, icon: s.icon, accent: s.accent })));
            setPersonas(PERSONAS.map(p => ({ id: p.id, label: p.label, emoji: p.emoji })));
            // Flatten content from STORYLINES
            const flat = [];
            STORYLINES.forEach(sl => {
              Object.entries(sl.personas).forEach(([pid, c]) => {
                flat.push({
                  id: `${sl.id}_${pid}`,
                  storylineId: sl.id,
                  personaId: pid,
                  painPoint: c.painPoint ? { ...c.painPoint } : { headline: '', description: '', dataPoint: '' },
                  strategicTalkingPoints: c.strategicTalkingPoints ? c.strategicTalkingPoints.map(x => ({ ...x })) : [],
                  tacticalSolutions: c.tacticalSolutions ? c.tacticalSolutions.map(x => ({ ...x })) : [],
                  marketInsights: c.marketInsights ? c.marketInsights.map(x => ({ ...x })) : [],
                  referenceCustomers: c.referenceCustomers ? [...c.referenceCustomers] : [],
                  conversationStarters: c.conversationStarters ? [...c.conversationStarters] : [],
                });
              });
            });
            setContent(flat);
          }
        }
        load();
      }, []);

      // Auto-select first
      useEffect(() => {
        if (storylines.length && !selectedStoryline) setSelectedStoryline(storylines[0].id);
      }, [storylines]);
      useEffect(() => {
        if (personas.length && !selectedPersona) setSelectedPersona(personas[0].id);
      }, [personas]);

      const current = content.find(c => c.storylineId === selectedStoryline && c.personaId === selectedPersona);

      const updateContent = (updater) => {
        setContent(prev => prev.map(c =>
          c.storylineId === selectedStoryline && c.personaId === selectedPersona
            ? updater(c) : c
        ));
      };

      const save = async () => {
        if (!current) return;
        setSaving(true);
        try {
          if (sb) {
            const { error } = await sb.from('storyline_content').update({
              pain_point: current.painPoint,
              strategic_talking_points: current.strategicTalkingPoints,
              tactical_solutions: current.tacticalSolutions,
              market_insights: current.marketInsights,
              reference_customers: current.referenceCustomers,
              conversation_starters: current.conversationStarters,
            }).eq('storyline_id', current.storylineId).eq('persona_id', current.personaId);
            if (error) throw error;
          }
          toast.show('Content saved');
        } catch (e) { toast.show('Save failed: ' + e.message, 'error'); }
        setSaving(false);
      };

      const currentStoryline = storylines.find(s => s.id === selectedStoryline);
      const currentPersona = personas.find(p => p.id === selectedPersona);

      return (
        <div className="fade-in">
          {/* Storyline selector */}
          <div className="mb-4">
            <label className="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Storyline</label>
            <div className="flex flex-wrap gap-2">
              {storylines.map(sl => (
                <button
                  key={sl.id}
                  onClick={() => setSelectedStoryline(sl.id)}
                  className={`text-xs px-3 py-2 rounded-lg font-medium transition-all flex items-center gap-1.5 ${
                    selectedStoryline === sl.id
                      ? 'bg-gray-900 text-white shadow-sm'
                      : 'bg-white text-gray-600 border border-gray-200 hover:border-gray-300'
                  }`}
                >
                  <span>{sl.icon}</span> {sl.name}
                </button>
              ))}
            </div>
          </div>

          {/* Persona selector */}
          <div className="mb-6">
            <label className="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Persona</label>
            <div className="flex gap-2">
              {personas.map(p => (
                <button
                  key={p.id}
                  onClick={() => setSelectedPersona(p.id)}
                  className={`text-xs px-3 py-2 rounded-lg font-medium transition-all ${
                    selectedPersona === p.id
                      ? 'bg-delaware text-white shadow-sm'
                      : 'bg-white text-gray-600 border border-gray-200 hover:border-gray-300'
                  }`}
                >
                  {p.emoji} {p.label}
                </button>
              ))}
            </div>
          </div>

          {/* Current selection header */}
          {currentStoryline && currentPersona && (
            <div className="bg-white rounded-t-xl border border-gray-200 border-b-0 px-5 py-3 flex items-center gap-3">
              <div className="w-1.5 h-6 rounded-full" style={{ backgroundColor: currentStoryline.accent }} />
              <span className="font-bold text-sm text-gray-900">{currentStoryline.icon} {currentStoryline.name}</span>
              <span className="text-gray-300">×</span>
              <span className="text-sm text-gray-500">{currentPersona.emoji} {currentPersona.label}</span>
            </div>
          )}

          {/* Content editor */}
          {current ? (
            <div className="bg-white rounded-b-xl rounded-tr-xl border border-gray-200 p-6">
              {/* Pain Point */}
              <div className="mb-6 bg-red-50 rounded-xl p-4 border border-red-100">
                <h4 className="text-xs font-bold text-red-700 uppercase tracking-wider mb-3">Pain Point</h4>
                <Field label="Headline" value={current.painPoint.headline}
                  onChange={v => updateContent(c => ({ ...c, painPoint: { ...c.painPoint, headline: v } }))} />
                <Field label="Description" value={current.painPoint.description} multiline
                  onChange={v => updateContent(c => ({ ...c, painPoint: { ...c.painPoint, description: v } }))} />
                <Field label="Data point" value={current.painPoint.dataPoint}
                  onChange={v => updateContent(c => ({ ...c, painPoint: { ...c.painPoint, dataPoint: v } }))} />
              </div>

              {/* Strategic Talking Points */}
              <div className="mb-6 bg-amber-50 rounded-xl p-4 border border-amber-100">
                <ObjectListEditor
                  label="Strategic Talking Points"
                  items={current.strategicTalkingPoints}
                  fields={[
                    { key: 'headline', label: 'Headline' },
                    { key: 'detail', label: 'Detail', multiline: true },
                  ]}
                  onChange={v => updateContent(c => ({ ...c, strategicTalkingPoints: v }))}
                />
              </div>

              {/* Tactical Solutions */}
              <div className="mb-6 bg-blue-50 rounded-xl p-4 border border-blue-100">
                <ObjectListEditor
                  label="Tactical Solutions"
                  items={current.tacticalSolutions}
                  fields={[
                    { key: 'name', label: 'Solution name' },
                    { key: 'description', label: 'Description', multiline: true },
                    { key: 'partner', label: 'Partner' },
                  ]}
                  onChange={v => updateContent(c => ({ ...c, tacticalSolutions: v }))}
                />
              </div>

              {/* Market Insights */}
              <div className="mb-6 bg-emerald-50 rounded-xl p-4 border border-emerald-100">
                <ObjectListEditor
                  label="Market Insights"
                  items={current.marketInsights}
                  fields={[
                    { key: 'stat', label: 'Statistic', multiline: true },
                    { key: 'source', label: 'Source' },
                  ]}
                  onChange={v => updateContent(c => ({ ...c, marketInsights: v }))}
                />
              </div>

              {/* Reference Customers */}
              <div className="mb-6 bg-gray-50 rounded-xl p-4 border border-gray-200">
                <ListEditor
                  label="Reference Customers"
                  items={current.referenceCustomers}
                  onChange={v => updateContent(c => ({ ...c, referenceCustomers: v }))}
                  placeholder="Customer name..."
                />
              </div>

              {/* Conversation Starters */}
              <div className="mb-6 bg-gray-50 rounded-xl p-4 border border-gray-100">
                <ListEditor
                  label="Conversation Starters"
                  items={current.conversationStarters}
                  onChange={v => updateContent(c => ({ ...c, conversationStarters: v }))}
                  placeholder="Open question..."
                />
              </div>

              {/* Save */}
              <div className="flex justify-end pt-2">
                <SaveButton onClick={save} saving={saving} label="Save content block" />
              </div>
            </div>
          ) : (
            <div className="bg-white rounded-b-xl border border-gray-200 p-8 text-center text-sm text-gray-400">
              Select a storyline and persona above to edit content.
            </div>
          )}
        </div>
      );
    }

    // ─── Admin App ───
    function AdminApp() {
      const [tab, setTab] = useState('content');
      const { toast, show } = useToast();

      const tabs = [
        { id: 'content', label: 'Storyline Content', icon: '📝' },
        { id: 'personas', label: 'Personas', icon: '👤' },
        { id: 'segments', label: 'Sub-Segments', icon: '🏭' },
        { id: 'storylines', label: 'Storylines', icon: '📖' },
      ];

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <header className="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 bg-delaware rounded-md flex items-center justify-center">
                  <span className="text-white font-bold text-lg">d</span>
                </div>
                <div>
                  <h1 className="text-base font-bold text-gray-900 leading-tight">Playbook Admin</h1>
                  <p className="text-xs text-gray-400">Edit content &middot; {supabaseConfigured ? 'Connected to Supabase' : 'Static mode (configure Supabase to save)'}</p>
                </div>
              </div>
              <a href="index.html" className="text-xs text-delaware hover:text-delaware-dark font-medium px-3 py-1.5 rounded-md hover:bg-red-50 transition-colors">
                View Playbook →
              </a>
            </div>
          </header>

          {/* Tabs */}
          <div className="max-w-5xl mx-auto px-4">
            <div className="flex gap-0 border-b border-gray-200 mt-4">
              {tabs.map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`px-4 py-3 text-sm font-medium transition-colors ${
                    tab === t.id ? 'tab-active' : 'text-gray-400 hover:text-gray-600'
                  }`}
                >
                  <span className="mr-1.5">{t.icon}</span>{t.label}
                </button>
              ))}
            </div>
          </div>

          {/* Tab content */}
          <div className="max-w-5xl mx-auto px-4 py-6">
            {supabaseInitError && (
              <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-3 mb-6 text-sm text-red-800">
                <strong>Supabase init error:</strong> {supabaseInitError}. Check that your anon key is correct (it should start with <code className="bg-red-100 px-1 rounded text-xs">eyJ…</code>).
              </div>
            )}
            {!supabaseConfigured && !supabaseInitError && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mb-6 text-sm text-amber-800">
                <strong>Static mode:</strong> Supabase is not configured. You can preview the editor, but changes won't be saved.
                Set <code className="bg-amber-100 px-1 rounded text-xs">SUPABASE_URL</code> and <code className="bg-amber-100 px-1 rounded text-xs">SUPABASE_ANON_KEY</code> in both <code className="bg-amber-100 px-1 rounded text-xs">admin.html</code> and <code className="bg-amber-100 px-1 rounded text-xs">index.html</code> to enable saving.
              </div>
            )}
            {tab === 'content' && <ContentTab toast={{ show }} />}
            {tab === 'personas' && <PersonasTab toast={{ show }} />}
            {tab === 'segments' && <SubSegmentsTab toast={{ show }} />}
            {tab === 'storylines' && <StorylinesTab toast={{ show }} />}
          </div>

          <Toast message={toast?.message} type={toast?.type} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
