    // ─── Data Loading Hook ───
    function usePlaybookData() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [source, setSource] = useState('static');

      useEffect(() => {
        async function fetchFromSupabase() {
          if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
            // No Supabase configured — use static data.js
            setData({ personas: PERSONAS, subSegments: SUB_SEGMENTS, storylines: STORYLINES });
            setSource('static');
            setLoading(false);
            return;
          }

          try {
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const [personasRes, segmentsRes, storylinesRes, contentRes] = await Promise.all([
              supabase.from('personas').select('*'),
              supabase.from('sub_segments').select('*'),
              supabase.from('storylines').select('*').order('sort_order'),
              supabase.from('storyline_content').select('*'),
            ]);

            if (personasRes.error || segmentsRes.error || storylinesRes.error || contentRes.error) {
              throw new Error('Supabase query error');
            }

            // Transform personas: snake_case → camelCase
            const personas = personasRes.data.map(p => ({
              id: p.id, label: p.label, subtitle: p.subtitle, emoji: p.emoji, focus: p.focus,
              careMost: p.care_most, keepsUpAtNight: p.keeps_up_at_night,
            }));

            // Transform sub_segments
            const subSegments = segmentsRes.data.map(s => ({
              id: s.id, label: s.label, short: s.short, description: s.description,
            }));

            // Transform storylines + attach content per persona
            const storylines = storylinesRes.data.map(sl => {
              const personasObj = {};
              contentRes.data
                .filter(c => c.storyline_id === sl.id)
                .forEach(c => {
                  personasObj[c.persona_id] = {
                    painPoint: c.pain_point,
                    strategicTalkingPoints: c.strategic_talking_points,
                    tacticalSolutions: c.tactical_solutions,
                    marketInsights: c.market_insights,
                    referenceCustomers: c.reference_customers,
                    conversationStarters: c.conversation_starters,
                  };
                });
              return {
                id: sl.id, name: sl.name, icon: sl.icon, accent: sl.accent,
                relevantSegments: sl.relevant_segments, personas: personasObj,
              };
            });

            setData({ personas, subSegments, storylines });
            setSource('supabase');
          } catch (err) {
            console.warn('Supabase fetch failed, falling back to static data:', err);
            setData({ personas: PERSONAS, subSegments: SUB_SEGMENTS, storylines: STORYLINES });
            setSource('static-fallback');
          } finally {
            setLoading(false);
          }
        }
        fetchFromSupabase();
      }, []);

      return { data, loading, source };
    }

              <StrategicPointsSection data={content.strategicTalkingPoints} aiData={aiPoints} />
              {customerContext && customerContext.companyName && (

    // ─── App Root (Single Page) ───
    function App() {
      const { data, loading, source } = usePlaybookData();
      const [selectedPersona, setSelectedPersona] = useState(null);
      const [selectedSegment, setSelectedSegment] = useState(null);
      const [openCards, setOpenCards] = useState({});
      const [customerContext, setCustomerContext] = useState({ companyName: '', extraInfo: '' });
      const [aiTalkingPoints, setAiTalkingPoints] = useState({});
      const [personalizing, setPersonalizing] = useState({});

      const personalizeStoryline = async (storyline) => {
        console.log('[Personaliseer] Klik ontvangen', { storylineId: storyline.id, selectedPersona: selectedPersona?.id, companyName: customerContext.companyName });
        if (!selectedPersona || !customerContext.companyName) {
          console.warn('[Personaliseer] Gestopt – selectedPersona:', selectedPersona, '| companyName:', customerContext.companyName);
          return;
        }
        const content = storyline.personas[selectedPersona.id];
        setPersonalizing(prev => ({ ...prev, [storyline.id]: true }));
        try {
          const url = `${SUPABASE_URL}/functions/v1/personalize-talking-points`;
          console.log('[Personaliseer] Fetch naar:', url);
          const res = await fetch(url, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              personaLabel: selectedPersona.label,
              storylineName: storyline.name,
              talkingPoints: content.strategicTalkingPoints,
              customerContext,
            }),
          });
          console.log('[Personaliseer] HTTP status:', res.status, res.statusText);
          const json = await res.json();
          console.log('[Personaliseer] Response:', json);
          if (json.talkingPoints) {
            setAiTalkingPoints(prev => ({ ...prev, [storyline.id]: json.talkingPoints }));
          } else {
            console.warn('[Personaliseer] Geen talkingPoints in response:', json);
          }
        } catch (err) {
          console.error('[Personaliseer] Fetch mislukt:', err?.name, err?.message, JSON.stringify(err));
        }
        setPersonalizing(prev => ({ ...prev, [storyline.id]: false }));
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-gray-50 flex items-center justify-center">
            <div className="text-center">
              <div className="w-10 h-10 bg-delaware rounded-lg flex items-center justify-center mx-auto mb-3 animate-pulse">
                <span className="text-white font-bold text-xl">d</span>
              </div>
              <p className="text-sm text-gray-400">Loading playbook...</p>
            </div>
          </div>
        );
      }

      const { personas: appPersonas, subSegments: appSubSegments, storylines: appStorylines } = data;

      const allOpen = appStorylines.every(s => openCards[s.id]);

      const toggleCard = (id) => {
        setOpenCards(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleAll = () => {
        if (allOpen) {
          setOpenCards({});
        } else {
          const all = {};
          appStorylines.forEach(s => { all[s.id] = true; });
          setOpenCards(all);
        }
      };

      const SALES_PLAYS = [
        {
          title: "Operational Backbone",
          description: "Modernise core systems and build operational resilience across supply chain, compliance, and cybersecurity.",
          color: "#f59e0b",
          borderColor: "border-amber-200",
          bgColor: "bg-amber-50",
          textColor: "text-amber-700",
          ids: ["erp-evolves", "resilience-compliance"]
        },
        {
          title: "Empower Your Factory Together with Your People",
          description: "Unlock knowledge, modernise the shopfloor, and equip frontline workers with digital tools.",
          color: "#8b5cf6",
          borderColor: "border-violet-200",
          bgColor: "bg-violet-50",
          textColor: "text-violet-700",
          ids: ["talent-knowledge", "factory-of-the-future", "frontline-workers"]
        },
        {
          title: "Digital Growth",
          description: "Grow revenue through digital channels, servitization, and superior customer experience.",
          color: "#ec4899",
          borderColor: "border-pink-200",
          bgColor: "bg-pink-50",
          textColor: "text-pink-700",
          ids: ["digital-business"]
        }
      ];

      const transversal = appStorylines.find(s => s.id === "value-of-data");

      return (
        <div className="min-h-screen bg-gray-50">
          <Header persona={selectedPersona} segment={selectedSegment} onBack={() => { setSelectedPersona(null); setSelectedSegment(null); setOpenCards({}); window.scrollTo(0,0); }} />

          <div className="max-w-5xl mx-auto px-4 py-8">
            {/* ── Persona Selection ── */}
            <div className="text-center mb-8">
              <h2 className="text-2xl sm:text-3xl font-extrabold text-gray-900">Who are you talking to?</h2>
              <p className="text-sm text-gray-400 mt-1">Select a persona to see tailored storylines and talking points</p>
            </div>

            <div className="grid sm:grid-cols-3 gap-4">
              {appPersonas.map((p) => (
                <PersonaCard
                  key={p.id}
                  persona={p}
                  selected={selectedPersona?.id === p.id}
                  onClick={() => {
                    setSelectedPersona(selectedPersona?.id === p.id ? null : p);
                    setOpenCards({});
                  }}
                />
              ))}
            </div>

            {/* ── Persona Profile + Segment Filter ── */}
            {selectedPersona && (
              <>
                <PersonaProfile persona={selectedPersona} />
                <SegmentFilter segments={appSubSegments} selected={selectedSegment} onSelect={setSelectedSegment} />
                <CustomerContextPanel context={customerContext} onChange={setCustomerContext} />

                {/* ── Sales Plays ── */}
                <div className="mt-10 max-w-3xl mx-auto fade-in">
                  <div className="flex items-center justify-between mb-6">
                    <h2 className="text-lg font-bold text-gray-900">
                      MAKE Sales Plays
                      <span className="text-gray-400 font-normal text-sm ml-2">for {selectedPersona.label}</span>
                    </h2>
                    <button
                      onClick={toggleAll}
                      className="text-xs text-gray-400 hover:text-gray-600 font-medium transition-colors"
                    >
                      {allOpen ? 'Collapse all' : 'Expand all'}
                    </button>
                  </div>

                  <div className="space-y-8">
                    {SALES_PLAYS.map((play, pi) => {
                      const playStorylines = play.ids.map(id => appStorylines.find(s => s.id === id)).filter(Boolean);
                      const sorted = selectedSegment
                        ? [...playStorylines].sort((a, b) => {
                            const aRel = a.relevantSegments.includes(selectedSegment.id) ? 0 : 1;
                            const bRel = b.relevantSegments.includes(selectedSegment.id) ? 0 : 1;
                            return aRel - bRel;
                          })
                        : playStorylines;

                      return (
                        <div key={pi}>
                          <div className={`rounded-xl ${play.bgColor} border ${play.borderColor} px-5 py-4 mb-3`}>
                            <div className="flex items-center gap-3">
                              <div className="w-1.5 h-10 rounded-full flex-shrink-0" style={{ backgroundColor: play.color }} />
                              <div>
                                <h3 className={`font-bold text-base ${play.textColor}`}>
                                  {play.title}
                                </h3>
                                <p className="text-xs text-gray-500 mt-0.5">{play.description}</p>
                              </div>
                            </div>
                          </div>
                          <div className="space-y-3 ml-0 sm:ml-3">
                            {sorted.map((storyline) => (
                              <StorylineCard
                                key={storyline.id}
                                storyline={storyline}
                                persona={selectedPersona}
                                segment={selectedSegment}
                                isOpen={!!openCards[storyline.id]}
                                onToggle={() => toggleCard(storyline.id)}
                                customerContext={customerContext}
                                aiTalkingPoints={aiTalkingPoints}
                                onPersonalize={personalizeStoryline}
                                personalizing={personalizing}
                              />
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* ── Transversal: Value of Data ── */}
                  {transversal && (
                    <div className="mt-10">
                      <div className="rounded-xl bg-emerald-50 border border-emerald-200 px-5 py-4 mb-3">
                        <div className="flex items-center gap-3">
                          <div className="flex-shrink-0 w-8 h-8 rounded-full bg-emerald-100 border border-emerald-300 flex items-center justify-center">
                            <span className="text-sm">📊</span>
                          </div>
                          <div>
                            <h3 className="font-bold text-base text-emerald-700">
                              Transversal
                              <span className="font-normal text-gray-400 text-sm ml-2">— Value of Data</span>
                            </h3>
                            <p className="text-xs text-gray-500 mt-0.5">Data strategy and manufacturing intelligence — the foundation that powers every sales play above.</p>
                          </div>
                        </div>
                      </div>
                      <div className="ml-0 sm:ml-3 relative">
                        <StorylineCard
                          storyline={transversal}
                          persona={selectedPersona}
                          segment={selectedSegment}
                          isOpen={!!openCards[transversal.id]}
                          onToggle={() => toggleCard(transversal.id)}
                          customerContext={customerContext}
                          aiTalkingPoints={aiTalkingPoints}
                          onPersonalize={personalizeStoryline}
                          personalizing={personalizing}
                        />
                      </div>
                    </div>
                  )}

                  <div className="mt-8 text-center text-xs text-gray-300">
                    delaware Manufacturing Playbook · Internal Use Only
                    {source !== 'static' && <span className="ml-2">· Live data</span>}
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
